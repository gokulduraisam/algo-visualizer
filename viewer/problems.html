<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My problems · Algo Visualizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1><a href="./" class="home">Algo Visualizer</a> · My problems</h1>
      <span class="account"><span id="who" class="who"></span></span>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>

    <main class="library">
      <div class="filters">
        <input id="search" type="search" placeholder="Search titles, tags, insights…" aria-label="Search" />
        <select id="difficulty" aria-label="Difficulty">
          <option value="">All difficulties</option>
          <option>Easy</option>
          <option>Medium</option>
          <option>Hard</option>
        </select>
        <span id="count" class="muted"></span>
      </div>
      <ul id="list" class="problem-list"></ul>
    </main>

    <script type="module" src="problems.js"></script>
  </body>
</html>
